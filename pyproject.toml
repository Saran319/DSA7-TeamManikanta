[project]
name = "rag-project"
version = "0.1.0"
description = "EPITA GenAI Week — RAG Project (Dive into Deep Learning)"
requires-python = ">=3.12"

dependencies = [
    "openai>=1.30.0",
    "python-dotenv>=1.0.0",
    "tiktoken>=0.7.0",
    "faiss-cpu>=1.8.0",
    "numpy>=1.26.0",
    "gradio>=4.36.0",
    # MCP real client — replaces direct Python imports of mcp_server
    "mcp>=1.0.0",
    "tavily-python>=0.5.0",
    "PyMuPDF>=1.24.0",
    "matplotlib>=3.8.0",
    "fastmcp>=0.1.0",
    "rank_bm25>=0.2.2",
    "sentence-transformers>=3.0.0",
    "nltk>=3.8.0",
    "pandas>=2.0.0"
]

[build-system]
requires      = ["hatchling"]
build-backend = "hatchling.build"
